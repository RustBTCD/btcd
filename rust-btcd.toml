# rust-btcd configuration.
# Usage: rust-btcd [path/to/rust-btcd.toml]
# Every key is optional. The values below are the defaults.

# Chain to follow: "main", "testnet4", "signet" or "regtest".
chain = "main"
# Most detailed log level printed: "error", "warn", "info", "debug" or "trace".
log_level = "info"

[storage]
# Base data directory. Each chain gets its own database in a subdirectory named after the
# chain, for example data/signet. Created if missing.
path = "data"
# RocksDB block cache shared by all column families, in MiB.
block_cache_mib = 256
# Upper bound on open files. macOS has a default soft limit of 256.
max_open_files = 200
# Values at least this large go to blob files and skip compaction, in bytes.
min_blob_size_bytes = 4096
# Number of RocksDB info log files to keep.
keep_log_files = 4
# Threads for flushes and compactions. Defaults to the number of CPU cores.
# background_threads = 8

# Blob garbage collection frees disk space held by deleted blocks and undo data.
# RocksDB cannot free part of a blob file: it copies the still-live values out of an old
# file during compaction, then deletes the whole file. Both values below are fractions
# from 0.0 to 1.0, not sizes or times.

# Share of blob files, counted by number of files and taken oldest first, whose live values
# compaction may copy out so the files can be deleted.
# 0.25 = the oldest quarter of files. 0.0 = never clean up, deleted blocks keep their space.
# 1.0 = free all garbage, but compaction may copy every stored block again.
blob_gc_oldest_files_fraction = 0.25
# Share of bytes in those oldest files that are garbage at which RocksDB schedules an extra
# compaction just to clean them. 1.0 = only when the files are entirely garbage. Below the
# trigger, cleanup waits for compactions that run anyway.
blob_gc_garbage_ratio_trigger = 1.0

[p2p]
# Peers kept connected at all times, as "host:port" or "host" for the chain's default port.
# Like Bitcoin Core's -addnode: they are kept in addition to the automatic connections below.
# Example: peers = ["127.0.0.1:18444"]
peers = []
# Automatic connections chosen from the address book. Bitcoin Core uses 8.
max_outbound = 8
# Ask the chain's DNS seeds for addresses when the address book is too small.
# Regtest has no seeds, so configure peers there.
use_dns_seeds = true
# Transport to use. Only the plain v1 transport exists so far; "v2" (BIP324) comes later.
transport = "v1"

# Seconds allowed for a TCP connection to open.
connect_timeout_secs = 10
# Seconds allowed for the version handshake. Bitcoin Core's -peertimeout.
handshake_timeout_secs = 60
# A peer that sends nothing for this many seconds is disconnected.
inactivity_timeout_secs = 1200
# Seconds a peer has to answer a header or block request before it is dropped as stalling.
request_timeout_secs = 120
# Seconds between pings to each peer. Bitcoin Core uses 2 minutes.
ping_interval_secs = 120
# Seconds to wait for a pong before dropping the peer. Bitcoin Core uses 20 minutes.
ping_timeout_secs = 1200
# Seconds between feeler connections, which briefly test an untried address. Core uses 2 minutes.
feeler_interval_secs = 120
# Minimum seconds between DNS seed lookups.
retry_interval_secs = 30

# Most addresses kept in the address book, which is stored in the database.
address_book_max = 20000
# Default length of a ban added at runtime, in seconds.
ban_duration_secs = 86400
# How long a misbehaving peer stays discouraged, in seconds. Discouragement is not stored.
discourage_duration_secs = 86400
# Subnets never connected to, as "10.0.0.0/8" or "1.2.3.4". Active while listed here.
bans = []
# Permissions by address, as "flag,flag@subnet". Flags: noban, download, relay, forcerelay,
# mempool, addr, bloomfilter. Only noban changes behaviour today; the rest are accepted and
# take effect when the matching features exist.
# Example: whitelist = ["noban@127.0.0.1"]
whitelist = []

# Messages that may be queued towards one peer before writes wait.
send_queue = 128
# Messages one peer may have queued for us before its socket stops being read.
recv_quota = 16
# User agent sent to peers, in BIP14 format. Defaults to /rust-btcd:<version>/.
# user_agent = "/rust-btcd:0.1.0/"

# rust-btcd configuration.
# Usage: rust-btcd [path/to/rust-btcd.toml]
# Every key is optional. The values below are the defaults.

[storage]
# Base data directory. Each database lives in a subdirectory of it, and is created if missing:
# one for the chainstate, one for block bodies, one for headers.
path = "data"

# Tuning for the storage engine. Which tables live in which database is decided in code.
[storage.rocks]
# Block cache shared by every database, in MiB.
block_cache_mib = 256
# Upper bound on open files. macOS has a default soft limit of 256.
max_open_files = 200
# Values at least this large are stored outside the sorted files, in bytes.
min_blob_size_bytes = 4096
# Number of engine log files to keep.
keep_log_files = 4
# Threads for flushes and compactions. 0 means the number of CPU cores.
background_threads = 0

# Collecting garbage frees the disk space held by deleted blocks and undo data. The engine
# cannot free part of a large-value file: it copies the live values out of an old file, then
# deletes the whole file. Both values below are fractions from 0.0 to 1.0, not sizes or times.

# Share of those files, oldest first, whose live values may be copied out so a file can go.
# 0.25 = the oldest quarter. 0.0 = never, so deleted blocks keep their space forever.
# 1.0 = free all garbage, at the cost of copying every stored block again over time.
blob_gc_oldest_files_fraction = 0.25
# Share of garbage in those files at which an extra cleanup is scheduled. 1.0 = only when a
# file is entirely garbage; below that, cleanup rides along with work that happens anyway.
blob_gc_garbage_ratio_trigger = 1.0
